# fail2ban filter for 薄肌研究所: failed or rate-limited logins in the nginx access log.
# Matches `POST /api/login` answered with 401 (wrong password) or 429 (nginx limit_req or the app's own lockout)
# in nginx's default "combined" log format:
#   203.0.113.7 - - [15/Oct/2026:21:04:05 +0800] "POST /api/login HTTP/2.0" 401 74 "https://…/login" "Mozilla/5.0 …"
# Test: fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/lianshiji-login.conf
[Definition]
# fail2ban cuts the matched timestamp out of the line before applying failregex, hence the empty "[]".
failregex = ^<HOST> \S+ \S+ \[\] "POST /api/login(?:\?[^ "]*)? HTTP/[0-9.]+" (?:401|429)\s
ignoreregex =
datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
