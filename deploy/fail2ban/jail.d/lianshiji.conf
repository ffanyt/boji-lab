# fail2ban jail for 薄肌研究所 logins. Install (Debian/Ubuntu):
#   cp deploy/fail2ban/filter.d/lianshiji-login.conf /etc/fail2ban/filter.d/
#   cp deploy/fail2ban/jail.d/lianshiji.conf /etc/fail2ban/jail.d/
#   systemctl reload fail2ban && fail2ban-client status lianshiji-login
# 10 failed or rate-limited logins from one address within 10 minutes → that address is blocked for an hour on
# ports 80 and 443 (every site on those ports, not just this one).
[lianshiji-login]
enabled  = true
filter   = lianshiji-login
backend  = auto
logpath  = /var/log/nginx/access.log
port     = http,https
maxretry = 10
findtime = 10m
bantime  = 1h
